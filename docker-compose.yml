version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: airline-booking-postgres
    environment:
      POSTGRES_USER: airline
      POSTGRES_PASSWORD: airline
      POSTGRES_DB: airline_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airline -d airline_booking"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: adminer for local DB inspection
  adminer:
    image: adminer
    container_name: airline-booking-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  postgres-data:
